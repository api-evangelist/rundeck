        expired:
          type: boolean
        creator:
          type: string
    CreateTokenRequest:
      type: object
      required:
        - user
      properties:
        user:
          type: string
          description: Username for the token
        roles:
          type: array
          items:
            type: string
          description: Roles to assign to the token
        duration:
          type: string
          description: Token duration (e.g., "30d", "1y")
    User:
      type: object
      properties:
        login:
          type: string
          description: Username
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        created:
          type: string
          format: date-time
        updated:
          type: string
          format: date-time
        lastJob:
          type: string
          format: date-time
        tokens:
