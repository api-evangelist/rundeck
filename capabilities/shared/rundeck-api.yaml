naftiko: "1.0.0-alpha1"

info:
  label: "Rundeck API"
  description: "Rundeck REST API for runbook automation - job management, execution control, project administration, node management, and system operations."
  tags:
    - Rundeck
    - Automation
    - DevOps
    - Job Scheduling
    - Runbook
  created: "2026-05-02"
  modified: "2026-05-02"

binds:
  - namespace: env
    keys:
      RUNDECK_API_TOKEN: RUNDECK_API_TOKEN
      RUNDECK_BASE_URL: RUNDECK_BASE_URL

capability:
  consumes:
    - type: http
      namespace: rundeck
      baseUri: "{{env.RUNDECK_BASE_URL}}/api/58"
      description: "Rundeck REST API v58 for automation and runbook operations"
      authentication:
        type: apikey
        key: X-Rundeck-Auth-Token
        value: "{{env.RUNDECK_API_TOKEN}}"
        placement: header
      resources:
        - name: projects
          path: /projects
          description: "Manage Rundeck projects"
          operations:
            - name: list-projects
              method: GET
              description: "List all accessible projects"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: array
                  value: "$."
            - name: create-project
              method: POST
              description: "Create a new project"
              body:
                type: json
                data:
                  name: "{{tools.name}}"
                  description: "{{tools.description}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: project
          path: /project/{project}
          description: "Manage a specific project"
          operations:
            - name: get-project
              method: GET
              description: "Get project details"
              inputParameters:
                - name: project
                  in: path
                  type: string
                  required: true
                  description: "Project name"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: delete-project
              method: DELETE
              description: "Delete a project"
              inputParameters:
                - name: project
                  in: path
                  type: string
                  required: true
                  description: "Project name"

        - name: project-jobs
          path: /project/{project}/jobs
          description: "Manage jobs within a project"
          operations:
            - name: list-jobs
              method: GET
              description: "List all jobs in a project"
              inputParameters:
                - name: project
                  in: path
                  type: string
                  required: true
                  description: "Project name"
                - name: jobFilter
                  in: query
                  type: string
                  required: false
                  description: "Filter by job name substring"
                - name: groupPath
                  in: query
                  type: string
                  required: false
                  description: "Filter by job group path"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: array
                  value: "$."

        - name: job
          path: /job/{id}
          description: "Manage a specific job by ID"
          operations:
            - name: get-job
              method: GET
              description: "Get job definition by ID"
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "Job UUID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: delete-job
              method: DELETE
              description: "Delete a job by ID"
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "Job UUID"

        - name: job-executions
          path: /job/{id}/executions
          description: "Run jobs and retrieve execution history"
          operations:
            - name: list-job-executions
              method: GET
              description: "List executions for a job"
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "Job UUID"
                - name: status
                  in: query
                  type: string
                  required: false
                  description: "Filter by status: running, succeeded, failed, aborted"
                - name: max
                  in: query
                  type: integer
                  required: false
                  description: "Maximum results to return"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: run-job
              method: POST
              description: "Trigger a job execution"
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "Job UUID"
              body:
                type: json
                data:
                  argString: "{{tools.argString}}"
                  loglevel: "{{tools.loglevel}}"
                  filter: "{{tools.filter}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: execution
          path: /execution/{id}
          description: "Manage individual executions"
          operations:
            - name: get-execution
              method: GET
              description: "Get execution status by ID"
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "Execution ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."
            - name: delete-execution
              method: DELETE
              description: "Delete an execution record"
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "Execution ID"

        - name: execution-abort
          path: /execution/{id}/abort
          description: "Abort running executions"
          operations:
            - name: abort-execution
              method: POST
              description: "Abort a running execution"
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "Execution ID"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: execution-output
          path: /execution/{id}/output
          description: "Retrieve execution log output"
          operations:
            - name: get-execution-output
              method: GET
              description: "Get execution log output"
              inputParameters:
                - name: id
                  in: path
                  type: string
                  required: true
                  description: "Execution ID"
                - name: lastlines
                  in: query
                  type: integer
                  required: false
                  description: "Number of lines from end"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: project-nodes
          path: /project/{project}/nodes
          description: "List and filter project nodes"
          operations:
            - name: list-nodes
              method: GET
              description: "List nodes in a project"
              inputParameters:
                - name: project
                  in: path
                  type: string
                  required: true
                  description: "Project name"
                - name: filter
                  in: query
                  type: string
                  required: false
                  description: "Node filter expression"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: system-info
          path: /system/info
          description: "System information"
          operations:
            - name: get-system-info
              method: GET
              description: "Get Rundeck server system information"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: system-executions-status
          path: /system/executions/status
          description: "Execution mode management"
          operations:
            - name: get-execution-mode
              method: GET
              description: "Get current execution mode (active/passive)"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

        - name: tokens
          path: /tokens
          description: "Manage API tokens"
          operations:
            - name: list-tokens
              method: GET
              description: "List API tokens"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: array
                  value: "$."
            - name: create-token
              method: POST
              description: "Create a new API token"
              body:
                type: json
                data:
                  user: "{{tools.user}}"
                  roles: "{{tools.roles}}"
                  duration: "{{tools.duration}}"
              outputRawFormat: json
              outputParameters:
                - name: result
                  type: object
                  value: "$."

  exposes:
    - type: rest
      port: 8100
      namespace: rundeck-rest
      resources:
        - path: /v1/projects
          name: projects
          description: "Rundeck project management"
          operations:
            - method: GET
              name: list-projects
              description: "List all projects"
              call: "rundeck.list-projects"
              outputParameters:
                - type: array
                  mapping: "$."
            - method: POST
              name: create-project
              description: "Create a project"
              call: "rundeck.create-project"
              with:
                name: "rest.name"
                description: "rest.description"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/projects/{project}/jobs
          name: jobs
          description: "Job management per project"
          operations:
            - method: GET
              name: list-jobs
              description: "List jobs in project"
              call: "rundeck.list-jobs"
              with:
                project: "rest.project"
              outputParameters:
                - type: array
                  mapping: "$."
        - path: /v1/jobs/{id}/executions
          name: job-executions
          description: "Job execution management"
          operations:
            - method: POST
              name: run-job
              description: "Run a job"
              call: "rundeck.run-job"
              with:
                id: "rest.id"
              outputParameters:
                - type: object
                  mapping: "$."
            - method: GET
              name: list-executions
              description: "List job executions"
              call: "rundeck.list-job-executions"
              with:
                id: "rest.id"
              outputParameters:
                - type: object
                  mapping: "$."
        - path: /v1/executions/{id}
          name: execution
          description: "Individual execution management"
          operations:
            - method: GET
              name: get-execution
              description: "Get execution status"
              call: "rundeck.get-execution"
              with:
                id: "rest.id"
              outputParameters:
                - type: object
                  mapping: "$."

    - type: mcp
      port: 9100
      namespace: rundeck-mcp
      transport: http
      tools:
        - name: list-projects
          description: "List all Rundeck projects"
          hints:
            readOnly: true
            openWorld: true
          call: "rundeck.list-projects"
          outputParameters:
            - type: array
              mapping: "$."
        - name: list-jobs
          description: "List jobs in a Rundeck project"
          hints:
            readOnly: true
            openWorld: true
          call: "rundeck.list-jobs"
          with:
            project: "tools.project"
            jobFilter: "tools.jobFilter"
          outputParameters:
            - type: array
              mapping: "$."
        - name: run-job
          description: "Run a Rundeck job by ID with optional arguments"
          hints:
            readOnly: false
            openWorld: false
          call: "rundeck.run-job"
          with:
            id: "tools.id"
            argString: "tools.argString"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-execution
          description: "Get the status of a Rundeck job execution"
          hints:
            readOnly: true
            openWorld: true
          call: "rundeck.get-execution"
          with:
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: abort-execution
          description: "Abort a running Rundeck execution"
          hints:
            readOnly: false
            destructive: true
            idempotent: true
          call: "rundeck.abort-execution"
          with:
            id: "tools.id"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-execution-output
          description: "Retrieve log output from a Rundeck execution"
          hints:
            readOnly: true
            openWorld: true
          call: "rundeck.get-execution-output"
          with:
            id: "tools.id"
            lastlines: "tools.lastlines"
          outputParameters:
            - type: object
              mapping: "$."
        - name: list-nodes
          description: "List nodes in a Rundeck project with optional filter"
          hints:
            readOnly: true
            openWorld: true
          call: "rundeck.list-nodes"
          with:
            project: "tools.project"
            filter: "tools.filter"
          outputParameters:
            - type: object
              mapping: "$."
        - name: get-system-info
          description: "Get Rundeck server system information and version"
          hints:
            readOnly: true
            openWorld: false
          call: "rundeck.get-system-info"
          outputParameters:
            - type: object
              mapping: "$."
